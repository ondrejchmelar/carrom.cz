report:
  cs: |
    14. - 18. 6. 2012, Německo, Darmstadt Letošního Eurocupu v Darmstadtu se za Českou carromovou asociaci zúčastnil Pavel "Šéfik" Schierl a Romana Králová s Filipem Smoljakem, kteří nastoupili jak na singly, tak na doubly. Horst Šimunský jako hlavní rozhodčí turnaje odpiskal finále singlu i doublu. Všem děkujeme za reprezntaci a gratulujeme.
