report:
  cs: |
    Pražská carromová liga začíná ve čtvrtek 18. ledna. Bohužel se musíme přesunout z kavárny TERCIE. Děkujeme však za roční azyl. 19. 7. a 2. 8. budeme hostovat v Čítárně Unijazzu, Jindřišská 901/5, Praha 1. 12. a 26. září se hraje v Café Lajka, U Akademie 11, Praha 7. Další hraní tohoto ročníku PCL budou odehrány v Nízkoprahovém klubu Husita, Nám. Barikád 1, Praha 3 – Žižkov Závěrečné hraní a vyhlášení bude 6. prosince v Bike Jesus, Orebitská 5, Praha 3. Více informací na pcl@carrom.cz.
