report:
  cs: |
    Carrom Medlešice League 2015 odstartoval počátkem roku 2011. Název byl odvozen dle místního piva z Medlešického pivovaru, který většina hráčů s občasnou pravidelností navštěvuje. Náhodně nebyla vybrána ani zkratka ligy, inspirovaná názvem kultovního sci-fi seriálu z mládí drtivé většiny hráčů. Liga je zaštítěna Českou carromovou asociací. Hlavním důvodem vzniku byla popularizace carromu i mimo Prahu. Liga je samozřejmě otevřena případným novým zájemcům, přijďte si carrom vyzkoušet a pod odborným dohledem "cvrnknout". Naplno se rozběhl šestý ročník ligy, pokračovat bude hracím dnem ve čtvrtek 17.3.2016 (místo konání Pardubice, pořadatel Radek). Tradičními hracími místy zůstanou i pro rok 2016 oblíbené restaurace v Pardubicích, Hrochově Týnci, Vysoké nad Labem a samozřejmě občasné hraní, či poklábosení v Medlešickém pivovaru.
