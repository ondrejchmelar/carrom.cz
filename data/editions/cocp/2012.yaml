report:
  cs: |
    Již potřetí se odehrál tradiční podzimní turnaj v aule HTF UK v Praze pod dohledem Mistra Jana. Tentokráte vyšla třetí listopadová sobota na krásného 17. listopadu. Zůčastnili se hráči z Polska, Německa, Itálie Švédska a Česka. Zvítězil Tobias Krüger, který ve finále porazil Fabia Tomasiho. Foto Zdeňka Tichého
