report:
  cs: |
    Tradiční podzimní turnaj se uskutečnil v sobotu 19. listopadu pod dohledem Mistra Jana v aule HTF UK v Praze. Zůčastnili se hráči z Polska, Německa, Itálie a Česka. Zvítězil Cornel D'Silva, který po strhujícim finále, hraném na 13 boardů, porazil Tobiase Krügera 25:23!!! V průběhu turnaje zahrál Cornel D'Silva jeden bílý slam. Foto Zdeňka Tichého
