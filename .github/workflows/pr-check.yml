# Checks every pull request (editors, the admin assistant, Ondrej): data, tests, build, permissions.
# The built site is attached to the run as "nahled" (download and open index.html), since
# GitHub Pages has no per-PR previews.
name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Permissions (data/roles.yaml)
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          label_args=""
          for l in $LABELS; do label_args="$label_args --label $l"; done
          git diff --name-only "$BASE"..."$HEAD" > changed.txt
          cat changed.txt
          xargs -a changed.txt -d '\n' node tools/check-scope.mjs --user "$AUTHOR" $label_args
      - name: Check data
        run: npm run check:data
      - name: Tests
        run: npm test
      - name: Astro build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nahled
          path: dist
          retention-days: 14
