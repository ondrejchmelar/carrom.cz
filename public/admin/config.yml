# Administrace carrom.cz (Sveltia CMS). Každé uložení = commit do repozitáře, web se sám přestaví (1–2 min).
# Přihlášení: tlačítko „Sign in with GitHub“ (účet musí být spolupracovníkem repa). Záložně „Sign in with Token“.
backend:
  name: github
  repo: ondrejchmelar/carrom.cz
  branch: main
  base_url: https://carrom-cz.chmelar-o.workers.dev   # přihlášení přes GitHub (sveltia-cms-auth na Cloudflare)
  commit_messages:
    create: "Přidáno: {{collection}} {{slug}}"
    update: "Upraveno: {{collection}} {{slug}}"
    delete: "Smazáno: {{collection}} {{slug}}"
    uploadMedia: "Nahráno: {{path}}"
    deleteMedia: "Smazáno: {{path}}"

site_url: https://ondrejchmelar.github.io/carrom.cz/
app_title: carrom.cz · administrace
logo:
  src: ../brand/emblem.svg
  show_in_header: true
logout_redirect_url: ../
locale: cs
media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_files
  locales: [cs, en]
  default_locale: cs

collections:
  # Přehled: položka jen otevře stránku /admin/prehled/ (přesměruje skript v index.html). Soubor je prázdný zástupce.
  - name: prehled
    label: Přehled
    description: Postup všech turnajů a lig. Otevírá se stránka přehledu.
    files:
      - { name: prehled, label: Přehled, file: public/admin/prehled.yml, fields: [{ name: info, label: Info, widget: hidden }] }

  - divider: true

  # ---------------- Turnaje ----------------
  - name: editions
    label: Turnaje · ročníky
    label_singular: Ročník
    folder: data/editions
    path: "{{competition}}/{{year}}"
    extension: yaml
    format: yaml
    create: true
    i18n: false
    summary: "{{competition}} {{year}} · {{status}}"
    sortable_fields: { fields: [start_date, competition], default: { field: start_date, direction: descending } }
    filter: { field: competition, pattern: "^(?!(pcl|cml|ol)$)" }
    view_filters:
      - { label: Plánované, field: status, pattern: "^planned$" }
      - { label: Přihlášky otevřené, field: status, pattern: "^registration_open$" }
      - { label: Odehrané, field: status, pattern: "^finished$" }
    view_groups: [{ label: Soutěž, field: competition }, { label: Rok, field: year }]
    fields:
      - &f_comp { name: competition, label: Soutěž, widget: relation, collection: competitions, value_field: code, search_fields: [code, name.cs], display_fields: ["{{name.cs}}"] }
      - &f_year { name: year, label: Rok, widget: string, pattern: ['^\d{4}$', 'Rok čtyřmi číslicemi, např. 2027'] }   # text, ne číslo: admin by jinak psal „2 027“
      - &f_ename { name: edition_name, label: Vlastní název ročníku, widget: object, required: false, collapsed: true, fields: [{ name: cs, label: Česky, widget: string, required: false }, { name: en, label: Anglicky, widget: string, required: false }] }
      - &f_status { name: status, label: Stav, widget: select, options: [{ label: Plánovaný, value: planned }, { label: Přihlášky otevřené, value: registration_open }, { label: Probíhá (liga), value: running }, { label: Odehraný, value: finished }], hint: "Posouvá se sám: s odkazem na přihlášku Přihlášky otevřené, s výsledky po konci turnaje Odehraný (u ligy po dohraném playoff). Ručně jen výjimky; zpátky se stav sám nevrací." }
      - &f_start { name: start_date, label: Začátek, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - &f_end { name: end_date, label: Konec, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
      - &f_venue
        name: venue
        label: Místo
        widget: object
        fields:
          - { name: name, label: Název, widget: string }
          - { name: city, label: Město, widget: string, required: false }
          - { name: address, label: Adresa, widget: string, required: false }
      - { name: signup_url, label: Přihláška (odkaz na Google Form), widget: string, required: false }
      - { name: signup_deadline, label: Přihlášky do, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
      - &f_cap { name: capacity, label: Kapacita (hráčů), widget: number, value_type: int, required: false }
      - &f_fee { name: entry_fee, label: Startovné / poplatky, widget: object, required: false, collapsed: true, hint: "Např. „200 Kč“. Při čisté částce dostane QR Platba v propozicích i částku.", fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string, required: false }] }
      - &f_prop { name: propozice, label: Propozice, widget: select, required: false, default: auto, options: [{ label: Vytvořit PDF z údajů ročníku, value: auto }, { label: Žádné (nebo nahrané v Dokumentech), value: none }], hint: "Nahraný dokument druhu propozice má vždy přednost." }
      - &f_sched { name: schedule, label: Program, widget: object, required: false, collapsed: true, fields: [{ name: cs, label: Česky, widget: text }, { name: en, label: Anglicky, widget: text, required: false }] }
      - &f_report { name: report, label: Zpráva o turnaji, widget: cs_en, required: false, hint: "Anglický text může doplnit tlačítko Přeložit (Google Gemini). Text vždy zkontrolujte." }
      - &f_sol { name: sol_lit_url, label: Detailní výsledky v SoL lit, widget: string, required: false }
      - &f_video { name: final_video, label: Video finále (odkaz na YouTube), widget: string, required: false, pattern: ["^(https://(www\\.)?(youtube\\.com|youtu\\.be)/.+)?$", "Odkaz na YouTube, např. https://youtu.be/…"] }
      - &f_source { name: source, label: Odkud výsledky, widget: select, options: [old-site, sol, admin], default: admin, required: false }
      - &f_results
        name: results
        label: Konečné pořadí
        widget: object
        required: false
        hint: "Turnaje doplňuje import ze SoL. U lig s playoff ho počítá web sám, nevyplňujte."
        fields:
          - name: singles
            label: Jednotlivci
            widget: list
            required: false
            fields:
              - { name: place, label: Místo, widget: number, value_type: int }
              - { name: player, label: Hráč, widget: relation, collection: players, value_field: "{{slug}}", search_fields: [first_name, last_name, nickname], display_fields: ["{{first_name}} {{last_name}}"], required: false }
              - { name: hidden, label: Hráč skrytý v SoL, widget: boolean, required: false, hint: "Jméno se nezveřejňuje" }
          - name: juniors
            label: Junioři
            widget: list
            required: false
            fields:
              - { name: place, label: Místo, widget: number, value_type: int }
              - { name: player, label: Hráč, widget: relation, collection: players, value_field: "{{slug}}", search_fields: [first_name, last_name], display_fields: ["{{first_name}} {{last_name}}"] }
              - { name: club_at_time, label: Klub / škola, widget: string, required: false }

  - name: rankings
    label: Turnaje · žebříček MČR
    label_singular: Tabulka MČR
    folder: data/rankings
    extension: yaml
    format: yaml
    create: true
    identifier_field: year
    slug: "mcr-{{year}}"
    summary: "MČR {{year}}"
    fields:
      - { name: year, label: Rok, widget: string, pattern: ['^\d{4}$', 'Rok čtyřmi číslicemi, např. 2027'] }   # text, ne číslo: admin by jinak psal „2 027“
      - { name: audience, label: Kategorie, widget: hidden, default: open }
      - { name: name, label: Název, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }
      - { name: editions, label: Turnaje (soutěž/rok), widget: list, hint: "Např. jarni/2027, druhy/2027, cocp/2027" }
      - { name: best_of, label: Počet započítaných turnajů, widget: number, value_type: int, default: 2 }
      - { name: points, label: Body, widget: select, options: [{ label: Spočítá web (od 2027), value: computed }, { label: Zapsané ručně (do 2026, staré pravidlo se 100 body), value: published }], default: computed }
      - { name: top_points, label: Body za vítězství, widget: number, value_type: int, required: false, hint: "Jen když body počítá web. Prázdné = 1000 (nastavení webu). Ručně zapsané roky do 2026 mají stupnici 100." }
      - { name: rounding, label: Zaokrouhlení, widget: hidden, default: whole }
      - { name: eligible, label: Kdo se počítá, widget: hidden, default: mcr }

  - name: competitions
    label: Turnaje a ligy · soutěže
    label_singular: Soutěž
    folder: data/competitions
    extension: yaml
    format: yaml
    create: true
    identifier_field: code
    slug: "{{code}}"
    summary: "{{name.cs}}"
    fields:
      - { name: code, label: Kód, widget: string, hint: "Krátký kód bez mezer, např. cocp" }
      - { name: kind, label: Druh, widget: select, options: [{ label: Turnaj, value: tournament }, { label: Liga, value: league }] }
      - { name: category, label: Kategorie v kalendáři, widget: select, options: [{ label: Turnaj MČR, value: mcr }, { label: Liga, value: league }, { label: Junioři, value: junior }, { label: Zahraničí, value: abroad }, { label: Ostatní, value: other }] }
      - { name: name, label: Název, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }
      - { name: short_name, label: Krátký název (odpočet), widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }
      - { name: description, label: Popis, widget: object, required: false, fields: [{ name: cs, label: Česky, widget: text }, { name: en, label: Anglicky, widget: text, required: false }] }
      - { name: contact_email, label: Kontaktní e-mail (jen adresy asociace), widget: string, required: false }
      - { name: archive_url, label: Archiv všech ročníků (odkaz), widget: string, required: false, hint: "Např. šampionát v SoL lit" }
      - { name: since, label: Hraje se od roku, widget: string, pattern: ['^\d{4}$', 'Rok čtyřmi číslicemi'], required: false }

  - divider: true

  # ---------------- Ligy ----------------
  - name: league_editions
    label: Ligy · sezóny
    label_singular: Sezóna
    folder: data/editions
    path: "{{competition}}/{{year}}"
    extension: yaml
    format: yaml
    create: true
    i18n: false
    summary: "{{competition}} {{year}} · {{status}}"
    sortable_fields: { fields: [start_date, competition], default: { field: start_date, direction: descending } }
    filter: { field: competition, pattern: "^(pcl|cml|ol)$" }
    view_filters:
      - { label: Probíhá, field: status, pattern: "^running$" }
      - { label: Přihlášky otevřené, field: status, pattern: "^registration_open$" }
      - { label: Skončené, field: status, pattern: "^finished$" }
    view_groups: [{ label: Soutěž, field: competition }, { label: Rok, field: year }]
    fields:
      - *f_comp
      - *f_year
      - *f_ename
      - *f_status
      - { name: phase, label: Fáze ligy, widget: select, required: false, options: [{ label: Základní kolo, value: group }, { label: Playoff, value: playoff }, { label: Skončila, value: finished }], hint: "Po přepnutí na Playoff web zmrazí nasazení podle tabulky." }
      - *f_start
      - *f_end
      - *f_venue
      - name: links
        label: Odkazy
        widget: object
        required: false
        fields:
          - { name: signup_url, label: Přihláška na sezónu (odkaz na Google Form), widget: string, required: false }
          - { name: evening_signup_url, label: Zápis na hrací večery (Google Sheet), widget: string, required: false }
          - { name: table_url, label: Tabulka základního kola (jen staré sezóny), widget: string, required: false }
      - *f_cap
      - *f_fee
      - *f_prop
      - *f_sched
      - name: format
        label: Formát sezóny
        widget: object
        required: false
        collapsed: true
        hint: "Z propozic, jednou za sezónu. Prázdné = každý s každým jednou, výhra 2 body, remíza 1, playoff o 1.–8. místo na jednu hru."
        fields:
          - name: group_stage
            label: Základní kolo
            widget: object
            required: false
            fields:
              - { name: until, label: Hraje se do, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
              - { name: legs, label: Kolikrát každý s každým, widget: number, value_type: int, default: 1, required: false }
              - { name: points, label: Body, widget: object, required: false, fields: [{ name: win, label: Za výhru, widget: number, value_type: int, default: 2 }, { name: draw, label: Za remízu, widget: number, value_type: int, default: 1 }] }
          - name: playoff
            label: Playoff
            widget: object
            required: false
            fields:
              - { name: bracket, label: Pavouk, widget: select, options: [{ label: "Po 8 hráčích (ČF, SF, F + o umístění)", value: pcl-8 }], default: pcl-8 }
              - { name: groups, label: Skupiny, widget: select, multiple: true, options: [{ label: "O 1.–8. místo", value: "1-8" }, { label: "O 9.–16. místo", value: "9-16" }], default: ["1-8"] }
              - { name: best_of, label: Na kolik her, widget: keyvalue, required: false, key_label: "Skupina / zápas", value_label: Počet her, hint: "Např. 1-8 = 3 (na dvě vítězné), 1-8/5-8 = 1 (o 5.–8. místo), 9-16 = 1. Neuvedené = 1." }
              - { name: dates, label: Termíny, widget: object, required: false, fields: [{ name: qf, label: Čtvrtfinále, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }, { name: sf, label: Semifinále, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }, { name: f, label: Finále, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }] }
      - *f_report
      - *f_sol
      - *f_video
      - *f_source
      - name: roster
        label: Soupiska ligy
        label_singular: hráč
        widget: list
        required: false
        hint: "Jen pro ligy. Hráči z přihlášek na sezónu."
        field: { name: player, label: Hráč, widget: relation, collection: players, value_field: "{{slug}}", search_fields: [first_name, last_name, nickname], display_fields: ["{{first_name}} {{last_name}}"] }
      - *f_results

  - name: league_evenings
    label: Ligy · PCL hrací večery
    label_singular: Hrací večer
    folder: data/leagues
    path: "{{season}}/{{date}}"
    extension: yaml
    format: yaml
    create: true
    summary: "{{season}} · {{date}}"
    filter: { field: season, pattern: "^pcl-" }
    fields:
      - { name: season, label: Sezóna, widget: string, pattern: ["^pcl-\\d{4}$", "Ve tvaru pcl-2027"], hint: "Ve tvaru pcl-2027. Z Přehledu (Zapsat večer) se vyplní samo." }
      - { name: date, label: Datum, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: venue, label: Jiné místo než obvykle, widget: string, required: false, hint: "Prázdné = místo sezóny" }
      - name: matches
        label: Zápasy
        label_singular: zápas
        widget: list
        fields:
          - { name: a, label: Hráč A, widget: relation, collection: players, value_field: "{{slug}}", search_fields: [first_name, last_name, short_name], display_fields: ["{{first_name}} {{last_name}}"] }
          - { name: b, label: Hráč B, widget: relation, collection: players, value_field: "{{slug}}", search_fields: [first_name, last_name, short_name], display_fields: ["{{first_name}} {{last_name}}"] }
          - { name: score, label: "Skóre (A:B)", widget: string, pattern: ["^\\d{1,2}:\\d{1,2}$", "Ve tvaru 25:11"] }
          - { name: forfeit, label: Kontumace, widget: boolean, default: false, required: false }
      - { name: scorecard, label: Fotka zápisu, widget: image, required: false }
      - { name: note, label: Poznámka, widget: string, required: false }

  - name: league_playoff
    label: Ligy · PCL playoff
    label_singular: Playoff
    folder: data/leagues
    path: "{{league}}/playoff"
    extension: yaml
    format: yaml
    create: true
    identifier_field: league
    summary: "Playoff {{league}}"
    sortable_fields: { fields: [league], default: { field: league, direction: descending } }
    filter: { field: league, pattern: "^pcl-\\d{4}$" }
    fields:
      - { name: league, label: Sezóna, widget: string, pattern: ["^pcl-\\d{4}$", "Ve tvaru pcl-2027"], hint: "Ve tvaru pcl-2027. Playoff nové sezóny založíte na Přehledu (Založit playoff)." }
      - { name: seeds, label: Nasazení, widget: string, default: auto, hint: "auto = podle tabulky po základním kole" }
      - name: games
        label: Hry
        widget: object
        hint: "Zápas = na 2 vítězné hry z 3 (nebo 1 hra), hra = do 25 bodů nebo 8 boardů. Každá hra je jeden řádek ve tvaru horní:dolní (horní = první hráč v popisku), např. 25:11. Na 2 vítězné z 3 (best of 3): zapište 2 hry a třetí jen při stavu 1:1. Kolik her se kde hraje, je ve Formátu sezóny (Na kolik her). Kdo hraje který zápas, spočítá web; živý pavouk je v náhledu vpravo."
        fields:
          - name: "1-8"
            label: Skupina o 1.–8. místo
            widget: object
            required: false
            fields:
              - { name: qf1, label: "Čtvrtfinále 1 · nasazený 1 – 8", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf2, label: "Čtvrtfinále 2 · nasazený 5 – 4", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf3, label: "Čtvrtfinále 3 · nasazený 3 – 6", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf4, label: "Čtvrtfinále 4 · nasazený 7 – 2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: sf1, label: "Semifinále 1 · vítěz ČF1 – vítěz ČF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: sf2, label: "Semifinále 2 · vítěz ČF3 – vítěz ČF4", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: l-sf1, label: "O 5.–8. místo (1) · poražený ČF1 – poražený ČF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: l-sf2, label: "O 5.–8. místo (2) · poražený ČF3 – poražený ČF4", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f1, label: "Finále · vítěz SF1 – vítěz SF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f3, label: "O 3. místo · poražený SF1 – poražený SF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f5, label: "O 5. místo · vítězové zápasů o 5.–8.", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f7, label: "O 7. místo · poražení zápasů o 5.–8.", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
          - name: "9-16"
            label: Skupina o 9.–16. místo
            widget: object
            required: false
            collapsed: true
            hint: "Jen když se hraje (Formát sezóny → Skupiny). Při 9–10 hráčích se hraje jen Finále = zápas o 9. místo."
            fields:
              - { name: qf1, label: "Čtvrtfinále 1 · nasazený 9 – 16", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf2, label: "Čtvrtfinále 2 · nasazený 13 – 12", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf3, label: "Čtvrtfinále 3 · nasazený 11 – 14", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: qf4, label: "Čtvrtfinále 4 · nasazený 15 – 10", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: sf1, label: "Semifinále 1 · vítěz ČF1 – vítěz ČF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: sf2, label: "Semifinále 2 · vítěz ČF3 – vítěz ČF4", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: l-sf1, label: "O 13.–16. místo (1) · poražený ČF1 – poražený ČF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: l-sf2, label: "O 13.–16. místo (2) · poražený ČF3 – poražený ČF4", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f1, label: "Finále (o 9. místo) · vítěz SF1 – vítěz SF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f3, label: "O 11. místo · poražený SF1 – poražený SF2", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f5, label: "O 13. místo · vítězové zápasů o 13.–16.", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }
              - { name: f7, label: "O 15. místo · poražení zápasů o 13.–16.", label_singular: hra, widget: list, required: false, hint: "Každá hra jeden řádek, horní:dolní, např. 25:11." }

  - divider: true

  # ---------------- Lidé ----------------
  - name: players
    label: Hráči
    label_singular: Hráč
    folder: data/players
    extension: yaml
    format: yaml
    create: true
    identifier_field: last_name
    slug: "{{first_name}}-{{last_name}}"
    summary: "{{last_name}} {{first_name}}{{nickname | ternary(' „' + nickname + '“', '')}}"
    sortable_fields: { fields: [last_name, first_name], default: { field: last_name } }
    view_filters:
      - { label: Hrají o titul MČR, field: mcr, pattern: true }
      - { label: Nehrají o MČR, field: mcr, pattern: "^(false|)$" }
    fields:
      - { name: first_name, label: Jméno, widget: string }
      - { name: last_name, label: Příjmení, widget: string }
      - { name: nickname, label: Přezdívka, widget: string, required: false }
      - { name: short_name, label: Krátké jméno do ligových tabulek, widget: string, required: false }
      - { name: country, label: Země (kód), widget: string, default: CZ }
      - { name: mcr, label: Hraje o titul MČR, widget: boolean, default: false, required: false, hint: "Zaškrtnutí se počítají do tabulky Mistrovství ČR." }
      - { name: page, label: Vlastní stránka, widget: select, options: [{ label: Automaticky, value: auto }, { label: Vždy, value: always }, { label: Nikdy, value: never }], default: auto, required: false }
      - { name: spellings, label: Jiné zápisy jména (pro import), widget: list, required: false }
      - { name: sol, label: ID hráče v SoL, widget: string, required: false, hint: "Doplní import ze SoL. Podle něj se hráč pozná při dalším importu." }

  - name: clubs
    label: Kluby a ligy (Kde hrát)
    label_singular: Klub
    folder: data/clubs
    extension: yaml
    format: yaml
    create: true
    summary: "{{name}}"
    fields:
      - { name: name, label: Název, widget: string }
      - { name: area, label: Místo (štítek), widget: string }
      - { name: order, label: Pořadí, widget: number, value_type: int, required: false }
      - { name: league, label: Liga (kód soutěže), widget: string, required: false }
      - { name: summary, label: Krátký popis, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string, required: false }] }
      - { name: description, label: Delší popis, widget: object, required: false, fields: [{ name: cs, label: Česky, widget: text }, { name: en, label: Anglicky, widget: text, required: false }] }
      - { name: web, label: Web klubu (odkaz), widget: string, required: false, pattern: ["^https?://", "Musí začínat https://"] }
      - { name: email, label: E-mail (jen adresy asociace/klubu), widget: string, required: false }
      - { name: active, label: Aktivní, widget: boolean, default: true }
      - { name: home, label: Na úvodní stránce, widget: boolean, default: true, required: false }

  - divider: true

  # ---------------- Web ----------------
  - name: articles
    label: Novinky
    label_singular: Zpráva
    folder: content/articles
    path: "{{year}}/{{year}}-{{month}}-{{day}}-{{slug}}"
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    create: true
    i18n: true
    sortable_fields: { fields: [publish_at, title], default: { field: publish_at, direction: descending } }
    summary: "{{publish_at | date('D. M. YYYY')}} · {{title}}"
    fields:
      - { name: title, label: Nadpis, widget: string, i18n: true }
      - { name: slug, label: Adresa (slug), widget: string, i18n: duplicate, hint: "Malá písmena bez diakritiky, např. open-cup-2026" }
      - { name: perex, label: Perex, widget: text, required: false, i18n: true }
      - { name: publish_at, label: Zveřejnit, widget: datetime, default: "{{now}}", i18n: duplicate }
      - { name: status, label: Stav, widget: select, options: [{ label: Koncept, value: draft }, { label: Zveřejněno, value: published }], default: published, i18n: duplicate }
      - { name: pinned, label: Připnout nahoru, widget: boolean, default: false, i18n: duplicate }
      - { name: cover, label: Úvodní fotka, widget: image, required: false, i18n: duplicate }
      - { name: edition, label: Ročník soutěže (výsledky pod článkem), widget: relation, collection: editions, value_field: "{{competition}}/{{year}}", search_fields: [competition, year], display_fields: ["{{competition}} {{year}}"], required: false, i18n: duplicate }
      - { name: tags, label: Štítky, widget: select, multiple: true, options: [turnaje, ligy, asociace, zahranici], required: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  - name: pages
    label: Stránky
    label_singular: Stránka
    folder: content/pages
    path: "{{slug}}"
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    create: true
    i18n: true
    fields:
      - { name: title, label: Nadpis, widget: string, i18n: true }
      - { name: slug, label: Adresa (slug), widget: string, i18n: duplicate }
      - { name: description, label: Popis (pro vyhledávače), widget: text, required: false, i18n: true }
      - { name: layout, label: Rozvržení, widget: select, options: [text, text-sidebar, gallery], default: text, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  - name: documents
    label: Dokumenty
    label_singular: Dokument
    folder: data/documents
    path: "{{year}}/{{slug}}"
    extension: yaml
    format: yaml
    create: true
    summary: "{{title.cs}}"
    fields:
      - { name: title, label: Název, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string, required: false }] }
      - { name: kind, label: Druh, widget: select, options: [propozice, poster, itinerary, results, minutes, statutes, rules, other] }
      - { name: date, label: Datum, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: edition, label: Ročník (soutěž/rok), widget: string, required: false }
      - { name: file, label: Soubor, widget: object, fields: [{ name: cs, label: Česky, widget: file }, { name: en, label: Anglicky, widget: file, required: false }] }

  - name: gallery
    label: Galerie
    files:
      - name: albums
        label: Fotoalba
        file: data/gallery.yaml
        fields:
          - name: albums
            label: Alba (nejnovější nahoře)
            label_singular: Album
            widget: list
            summary: "{{fields.year}} · {{fields.title.cs}}"
            fields:
              - { name: title, label: Název, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string, required: false }] }
              - { name: year, label: Rok, widget: string, pattern: ['^\d{4}$', 'Rok čtyřmi číslicemi, např. 2027'] }
              - { name: url, label: Odkaz na album, widget: string, hint: "Adresa alba na jAlbum, Rajče, Google Fotkách apod." }
              - { name: photographer, label: Fotograf, widget: string, required: false }
              - { name: cover, label: Náhledový obrázek, widget: image, required: false, media_folder: /public/uploads/galerie, public_folder: /uploads/galerie }
              - { name: edition, label: "Ročník turnaje (soutěž/rok, např. cocp/2025)", widget: string, required: false }

  - name: settings
    label: Nastavení webu
    files:
      - name: settings
        label: Nastavení
        file: data/settings.yaml
        fields:
          - { name: preview_banner, label: Pruh „Testovací verze“, widget: boolean }
          - name: player_page
            label: Stránky hráčů
            widget: object
            fields:
              - { name: min_wins, label: Aspoň vítězství, widget: number, value_type: int }
              - { name: min_results, label: Nebo aspoň výsledků, widget: number, value_type: int }
          - name: payment
            label: Platby (startovné a ligové poplatky)
            widget: object
            fields:
              - { name: preferred, label: Preferovaný způsob, widget: hidden, default: bank_transfer }
              - { name: account, label: Číslo účtu, widget: string, required: false }
              - { name: qr_image, label: QR kód pro platbu, widget: image, required: false }
              - { name: iban, label: IBAN (platby ze zahraničí), widget: string, required: false }
              - { name: bic, label: BIC, widget: string, required: false }
              - { name: transparent_url, label: Odkaz na transparentní účet, widget: string, required: false, pattern: ['^https?://', 'Musí začínat http:// nebo https://'] }
              - { name: note, label: Text u plateb, widget: object, fields: [{ name: cs, label: Česky, widget: text }, { name: en, label: Anglicky, widget: text }] }
          - name: calendars
            label: Sdílené Google kalendáře
            widget: list
            collapsed: true
            fields:
              - { name: id, label: Adresa kalendáře (…@group.calendar.google.com), widget: string }
              - { name: cs, label: Název česky, widget: string }
              - { name: en, label: Název anglicky, widget: string }
          - { name: site, label: Údaje asociace, widget: object, collapsed: true, fields: [{ name: name, label: Název webu, widget: string }, { name: org, label: Název asociace, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }, { name: email, label: E-mail, widget: string }, { name: facebook, label: Facebook, widget: string, required: false }, { name: address, label: Sídlo, widget: string }, { name: ico, label: IČ, widget: string }, { name: data_box, label: Datová schránka, widget: string, required: false }] }
      - name: home
        label: Úvodní stránka
        file: data/home.yaml
        fields:
          - name: hero
            label: Hlavní text
            widget: object
            fields:
              - { name: title, label: Nadpis, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }
              - { name: text, label: Text, widget: object, fields: [{ name: cs, label: Česky, widget: text }, { name: en, label: Anglicky, widget: text }] }
              - { name: play_button, label: Tlačítko hry, widget: object, fields: [{ name: cs, label: Česky, widget: string }, { name: en, label: Anglicky, widget: string }] }
          - { name: where_to_play, label: "Kluby v bloku Kde hrát", widget: relation, collection: clubs, value_field: "{{slug}}", search_fields: [name], display_fields: [name], multiple: true }
