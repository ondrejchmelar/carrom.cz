<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Administrace · carrom.cz</title>
  <link rel="icon" href="../favicon.ico" />
  <meta name="theme-color" content="#0E1B3D" />
  <style>
    /* Barvy webu carrom.cz místo výchozí modré Sveltia CMS (odstín navy #0E1B3D). */
    :root:root { --sui-base-hue: 223; }
  </style>
</head>
<body>
  <!-- Sveltia CMS: Git-based admin. Data are YAML/Markdown files in this repository. -->
  <script>
    // Položka menu „Přehled“ otevře stránku přehledu (Sveltia v menu neumí odkaz).
    // Admin se otevírá na první položce menu, takže přehled je zároveň úvodní stránka.
    function openOverview() { if (location.hash.indexOf('#/collections/prehled') === 0) location.replace('prehled/'); }
    window.addEventListener('hashchange', openOverview);
    openOverview();
  </script>
  <script src="https://unpkg.com/@sveltia/cms@0.262.4/dist/sveltia-cms.js"></script>
  <script src="postup.js"></script>
  <script src="kontrola.js"></script>
</body>
</html>
